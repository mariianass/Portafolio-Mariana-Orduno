<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Trabajando flex box</title>
    <style>

      /*

      .container {
        border: 2px solid purple;
        padding: 10px;
        background-color: #f0f0f5;
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        height: 200px;
        flex-direction: column;
      }

      .caja {
        width: 80px;
        height: 60px;
        background-color: pink;
        color: black;
        flex: 1;
      }

    </style>
</head>
<body>

    <div class="container">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
    </div>

</body>
